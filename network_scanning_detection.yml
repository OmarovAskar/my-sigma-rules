title: Detection of Network Scanning and Enumeration Tools
id: 4b2a8d1e-9c3f-4e5a-8d1e-8b1c4e5a3d2c
status: experimental
description: Detects execution of network scanning and reconnaissance tools like nmap, nc, and netcat from bash history.
author: Oskar
date: 2026-03-27
tags:
    - attack.reconnaissance
    - attack.t1595
logsource:
    product: linux
    service: bash_history
detection:
    selection:
        # Используем наше новое поле, которое распарсил Vector
        process.command_line|contains:
            - 'nmap'
            - 'nmaps'
            - 'netcat'
            - 'ncat'
            - 'nc '
            - 'nc.openbsd'
            - 'telnet'
    condition: selection
falsepositives:
    - Legitimate administrator network troubleshooting
level: medium